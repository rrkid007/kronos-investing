<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Research Terminal{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0d10'/%3E%3Crect x='3' y='6' width='3' height='7' fill='%23ffb000'/%3E%3Crect x='7' y='3' width='3' height='10' fill='%232ee06f'/%3E%3Crect x='11' y='8' width='3' height='5' fill='%23ff4d57'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Unica+One&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@2.0.4"
        integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
        crossorigin="anonymous"></script>
<style>
:root {
  --bg: #0a0d10;
  --panel: #10151b;
  --panel-2: #141b23;
  --line: #1d2733;
  --ink: #c9d4de;
  --ink-dim: #5d6e7e;
  --amber: #ffb000;
  --up: #2ee06f;
  --down: #ff4d57;
  --hold: #5d6e7e;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; padding: 24px 28px 64px;
  background:
    repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.012) 2px 4px),
    radial-gradient(1200px 400px at 20% -10%, rgba(255,176,0,0.05), transparent 60%),
    var(--bg);
  color: var(--ink);
  font: 13px/1.55 "IBM Plex Mono", monospace;
  font-variant-numeric: tabular-nums;
}
header.masthead {
  display: flex; align-items: baseline; gap: 18px;
  border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 22px;
}
.masthead h1 {
  font-family: "Unica One", "IBM Plex Mono", monospace;
  font-size: 26px; letter-spacing: 3px; margin: 0;
  color: var(--amber); text-transform: uppercase; font-weight: 400;
}
.masthead .sub { color: var(--ink-dim); font-size: 12px; }
.masthead nav { margin-left: auto; }
.masthead nav a { color: var(--ink-dim); text-decoration: none; margin-left: 16px;
  text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; }
.masthead nav a:hover { color: var(--amber); }

.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.card {
  grid-column: span 12; background: var(--panel);
  border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px 16px;
  animation: rise .35s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.card:nth-child(2) { animation-delay: .05s } .card:nth-child(3) { animation-delay: .1s }
.card:nth-child(4) { animation-delay: .15s } .card:nth-child(5) { animation-delay: .2s }
.span6 { grid-column: span 6; } .span4 { grid-column: span 4; } .span8 { grid-column: span 8; }
@media (max-width: 900px) { .span6, .span4, .span8 { grid-column: span 12; } }

h2 {
  margin: 0 0 10px; font-size: 11px; letter-spacing: 2.5px; font-weight: 600;
  text-transform: uppercase; color: var(--ink-dim);
}
h2::before { content: "▮ "; color: var(--amber); }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--ink-dim); font-weight: 500; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 1px; padding: 4px 8px;
  border-bottom: 1px solid var(--line); }
td { padding: 5px 8px; border-bottom: 1px solid rgba(29,39,51,.55); }
tr:hover td { background: var(--panel-2); }
td.num, th.num { text-align: right; }

.kpis { display: flex; flex-wrap: wrap; gap: 26px; }
.kpi .label { color: var(--ink-dim); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 1.5px; }
.kpi .value { font-size: 21px; font-weight: 600; }
.kpi .value.big { font-size: 27px; color: var(--amber); }

.up { color: var(--up); } .down { color: var(--down); } .dim { color: var(--ink-dim); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 2px; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 1px; border: 1px solid; }
.badge.buy { color: var(--up); border-color: var(--up); }
.badge.sell { color: var(--down); border-color: var(--down); }
.badge.watchlist { color: var(--amber); border-color: var(--amber); }
.badge.hold { color: var(--hold); border-color: var(--hold); }

button {
  font: 600 11px "IBM Plex Mono", monospace; letter-spacing: 1px; text-transform: uppercase;
  padding: 4px 12px; border-radius: 2px; cursor: pointer;
  background: transparent; transition: all .12s;
}
button.approve { color: var(--up); border: 1px solid var(--up); }
button.approve:hover { background: var(--up); color: #04130a; }
button.reject { color: var(--down); border: 1px solid var(--down); }
button.reject:hover { background: var(--down); color: #160405; }

.flash { border: 1px solid var(--amber); color: var(--amber); padding: 6px 10px;
  margin-bottom: 10px; font-size: 12px; }
.empty { color: var(--ink-dim); padding: 10px 0; }
.chart svg { width: 100%; height: 180px; display: block; }
.scorebar { display: inline-block; min-width: 38px; }
a { color: var(--amber); }
footer { margin-top: 28px; color: var(--ink-dim); font-size: 11px;
  border-top: 1px solid var(--line); padding-top: 12px; }
</style>
</head>
<body>
<header class="masthead">
  <h1>Research Terminal</h1>
  <span class="sub">{% block subtitle %}paper trading · human approval required{% endblock %}</span>
  <nav><a href="/">Dashboard</a><a href="/reports">Reports</a></nav>
</header>
{% block content %}{% endblock %}
<footer>local ai investment research platform — agents analyze · risk engine controls · human approves · broker executes</footer>
</body>
</html>
