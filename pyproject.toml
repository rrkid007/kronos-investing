[project]
name = "trading-platform"
version = "0.1.0"
description = "Local AI Investment Research Platform — multi-agent stock research and paper trading"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "yfinance>=0.2.50",
    "requests>=2.31",
    "edgartools>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # dashboard settings form posts
    "ruamel.yaml>=0.18",        # comment-preserving config writes
    "apscheduler>=3.10",        # in-app job scheduler
    "lxml>=5.0",  # pandas.read_html (S&P 500 universe)
]

[project.optional-dependencies]
# Kronos forecasting (heavy: pulls PyTorch). Install: uv sync --extra kronos
kronos = [
    "torch>=2.0",
    "einops>=0.8",
    "huggingface-hub>=0.30",
    "safetensors>=0.4",
    "tqdm>=4.66",
]

# Paid Kronos forecast service — x402 micropayments. Install: uv sync --extra service
# Only needed to *meter* the service; it runs free (payments disabled) without this.
# The evm marker is required: without it x402.mechanisms.evm.exact raises on
# import and the paywall cannot construct its scheme.
service = [
    "x402[fastapi,evm]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",  # FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/trading_platform/vendor"]
