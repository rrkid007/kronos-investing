[project]
name = "trading-platform"
version = "0.1.0"
description = "Local AI Investment Research Platform — multi-agent stock research and paper trading"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "yfinance>=0.2.50",
    "requests>=2.31",
    "edgartools>=3.0",
]

[project.optional-dependencies]
# Kronos forecasting (heavy: pulls PyTorch). Install: uv sync --extra kronos
kronos = [
    "torch>=2.0",
    "einops>=0.8",
    "huggingface-hub>=0.30",
    "safetensors>=0.4",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/trading_platform/vendor"]
