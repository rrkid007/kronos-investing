# Deterministic risk limits enforced by the Risk Engine. No AI touches these.
max_position_pct: 15.0      # max single-position size as % of account equity
max_sector_pct: 40.0        # max combined exposure to one sector
min_cash_reserve_pct: 10.0  # cash floor as % of equity
min_final_score: 70.0       # decisions below this are never tradable
restricted_assets: []       # tickers that may never be traded

require_human_approval: true  # manual approval queue (locked decision 2026-06-11)

paper_account:
  starting_cash: 100000.0

sizing:
  base_position_pct: 10.0     # base position as % of equity
  min_position_value: 1000.0  # buys smaller than this are rejected
  target_vol: 0.25            # annualized vol target; size scales inversely
  max_positions: 8

fill_model:
  # Decisions made after close on day T fill at day T+1 open.
  slippage_bps: 5.0
  commission_per_trade: 0.0
