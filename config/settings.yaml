# Platform-wide settings. Paths are relative to the repo root unless absolute.
db_path: db/investment_research.sqlite
reports_dir: reports
timezone: America/New_York
benchmarks: [SPY, QQQ]   # tracked in price_cache for performance comparison

llm:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen2.5:32b-instruct
  timeout_seconds: 120

kronos:
  # Kronos-small (25M params) for dev machines; switch to NeoQuasar/Kronos-base
  # (102M) on the DGX Spark. Both use the 512-context base tokenizer.
  model_id: NeoQuasar/Kronos-small
  tokenizer_id: NeoQuasar/Kronos-Tokenizer-base
  horizon_days: 10
  context_candles: 400
  max_context: 512
  sample_count: 8   # forecast paths per ticker; path agreement drives confidence
  temperature: 1.0
  top_p: 0.9

news:
  # Finnhub key is read from this environment variable — never stored in config.
  finnhub_api_key_env: FINNHUB_API_KEY
  rss_feeds: []
  lookback_days: 7
  max_items: 25

sec:
  # EDGAR requires a descriptive User-Agent with contact info.
  identity: "Peak Logic info@peaklogic.ai"
  max_risk_chars: 10000
  max_mdna_chars: 6000

notifications:
  enabled: false
  webhook_url: ""

schedule:
  run_after_close_local: "17:30"
  weekdays_only: true
